<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 纯粹深邃背景 (无任何外边描边，0 白边毛刺) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B20" />
      <stop offset="100%" stop-color="#101114" />
    </linearGradient>

    <!-- 初音绿核心渐变 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FE3D9" />
      <stop offset="100%" stop-color="#39C5BB" />
    </linearGradient>
  </defs>

  <!-- 1. 纯净深色底座 (无 stroke) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />

  <!-- 2. 清晰锐利的高对比声波 (加粗至 36px，大幅减少小尺寸粘连) -->
  <g stroke="url(#primaryGrad)" stroke-linecap="round" fill="none">
    <!-- 右上主声波 -->
    <path d="M 256 90 A 166 166 0 0 1 422 256" stroke-width="38" />
    <path d="M 256 150 A 106 106 0 0 1 362 256" stroke-width="36" />

    <!-- 左下主声波 -->
    <path d="M 256 422 A 166 166 0 0 1 90 256" stroke-width="38" />
    <path d="M 256 362 A 106 106 0 0 1 150 256" stroke-width="36" />
  </g>

  <!-- 3. 中心圆角播放内核 -->
  <path d="M 232 200 C 232 192 242 186 250 192 L 306 238 C 314 244 314 256 306 262 L 250 308 C 242 314 232 308 232 300 Z" fill="url(#primaryGrad)" />
</svg>
