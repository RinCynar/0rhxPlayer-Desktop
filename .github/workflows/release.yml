name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev pkg-config

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend & Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '0rhxPlayer v__VERSION__'
          releaseBody: |
            ## 0rhxPlayer v__VERSION__
            
            ### ✨ Features
            - **Audio Pipeline**: WASAPI / DirectSound basic stream scheduler with low latency.
            - **DSP Processing**: 10-Band Biquad Equalizer with presets.
            - **Material You 3.0**: M3 motion system with teal theme (#39C5BB).
            - **Cross-Platform**: Windows (Installer `.exe` & Portable `.zip`) and Linux (`.AppImage` & Portable `.tar.gz`).
            
            ### 🌐 Links
            - Website: [0rhxplayer.rincynar.top](https://0rhxplayer.rincynar.top)
            - VSCode Extension: [0rhxPlayer for VSCode](https://marketplace.visualstudio.com/items?itemName=RinCynar.0rhxplayer)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Portable Windows Archive (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.0.0"
          $target = "${{ matrix.target }}"
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -File | Where-Object { ($_.Name -eq "0rhxPlayer.exe" -or $_.Name -eq "app.exe") -and $_.FullName -like "*release*" -and $_.FullName -notlike "*deps*" -and $_.FullName -notlike "*build*" } | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force -Path "dist-portable"
            Copy-Item $exe.FullName -Destination "dist-portable/0rhxPlayer.exe"
            Compress-Archive -Path "dist-portable/*" -DestinationPath "0rhxPlayer_${ver}_${target}_portable.zip" -Force
          }

      - name: Package Portable Linux Archive (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          ver="1.0.0"
          target="${{ matrix.target }}"
          bin_path=$(find src-tauri/target -type f \( -name "0rhxPlayer" -o -name "app" \) | grep "release" | grep -v "deps" | grep -v "build" | head -n 1)
          if [ -n "$bin_path" ]; then
            mkdir -p dist-portable
            cp "$bin_path" dist-portable/0rhxPlayer
            chmod +x dist-portable/0rhxPlayer
            tar -czvf "0rhxPlayer_${ver}_${target}.tar.gz" -C dist-portable 0rhxPlayer
          fi

      - name: Upload Portable Archives to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            0rhxPlayer_*.zip
            0rhxPlayer_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
