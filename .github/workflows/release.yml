name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.1.1)'
        required: false
        default: '1.1.1'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build & Package Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup & Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          choco install innosetup -y --no-progress --ia "/DIR=C:\InnoSetup"
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "C:\InnoSetup`n")

      - name: Install Qt 6.8 & MinGW Toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Target
        shell: pwsh
        run: |
          ninja -C build -v

      - name: Run Regression Self-Tests
        shell: pwsh
        run: |
          ./build/0rhxPlayer.exe --test-phase9
          ./build/0rhxPlayer.exe --test-phase8
          ./build/0rhxPlayer.exe --test-queue

      - name: Package Dual Release Artifacts (Portable Zip & Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $inputVer = "${{ github.event.inputs.version }}"
          $ver = "1.1.1"
          if ($inputVer) {
              $ver = $inputVer
          } elseif ($tag -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') {
              $ver = $matches[1]
          }
          Write-Host "Packaging Windows x64 version $ver..."
          & ./scripts/package.ps1 -Version $ver -Arch "x64" -BuildDir "build" -DistDir "dist"

      - name: Verify Distributables
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist" -File | Format-Table Name, Length
          $setup = Get-ChildItem -Path "dist" -Filter "*setup.exe"
          $zip = Get-ChildItem -Path "dist" -Filter "*portable.zip"
          if (-not $setup -or -not $zip) {
              throw "Missing Windows x64 distributable files! setup=$setup, zip=$zip"
          }

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error

  build-windows-arm64:
    name: Build & Package Windows ARM64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup & Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          choco install innosetup -y --no-progress --ia "/DIR=C:\InnoSetup"
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "C:\InnoSetup`n")

      - name: Install Qt 6.8 & MinGW Toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Target
        shell: pwsh
        run: |
          ninja -C build -v

      - name: Package Windows ARM64 Release (Portable Zip & Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $inputVer = "${{ github.event.inputs.version }}"
          $ver = "1.1.1"
          if ($inputVer) {
              $ver = $inputVer
          } elseif ($tag -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') {
              $ver = $matches[1]
          }
          Write-Host "Packaging Windows ARM64 version $ver..."
          & ./scripts/package.ps1 -Version $ver -Arch "arm64" -BuildDir "build" -DistDir "dist"

      - name: Verify Distributables
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist" -File | Format-Table Name, Length
          $setup = Get-ChildItem -Path "dist" -Filter "*arm64*setup.exe"
          $zip = Get-ChildItem -Path "dist" -Filter "*arm64*.zip"
          if (-not $setup -or -not $zip) {
              throw "Missing Windows ARM64 distributable files! setup=$setup, zip=$zip"
          }

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-arm64
          path: dist/*arm64*
          if-no-files-found: error

  build-linux-x64:
    name: Build & Package Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libpulse-dev \
            libasound2-dev \
            xvfb

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8 for Linux
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'
          cache: true
          setup-python: false

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Target
        run: |
          ninja -C build -v

      - name: Run Headless Self-Tests
        run: |
          export LD_LIBRARY_PATH="$(pwd)/build:$(pwd)/libs/bass/linux-x64/lib:${LD_LIBRARY_PATH:-}"
          xvfb-run -a ./build/0rhxPlayer --test-phase9
          xvfb-run -a ./build/0rhxPlayer --test-phase8
          xvfb-run -a ./build/0rhxPlayer --test-queue

      - name: Package Linux x64 Artifacts (Portable Tarball & AppImage)
        run: |
          TAG="${{ github.ref_name }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          VER="1.1.1"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
          elif [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VER="${BASH_REMATCH[1]}"
          fi
          chmod +x ./scripts/package-linux.sh ./scripts/package-appimage.sh
          ./scripts/package-linux.sh -v "$VER" -a "x64" -b "build" -d "dist"
          ./scripts/package-appimage.sh -v "$VER" -a "x64" -b "build" -d "dist"

      - name: Verify Linux x64 Distributables
        run: |
          ls -lh dist/
          test -f dist/0rhxPlayer-v*-linux-x64-portable.tar.gz
          test -f dist/0rhxPlayer-v*-linux-x64.AppImage

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/*x64*.tar.gz
            dist/*x64*.AppImage
          if-no-files-found: error

  build-linux-arm64:
    name: Build & Package Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Package in ARM64 Container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          install: |
            apt-get update -q -y
            DEBIAN_FRONTEND=noninteractive apt-get install -q -y --no-install-recommends \
              cmake ninja-build g++ file curl tar ca-certificates squashfs-tools \
              qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
              libasound2-dev libgl1-mesa-dev
          run: |
            cd /workspace
            TAG="${{ github.ref_name }}"
            INPUT_VER="${{ github.event.inputs.version }}"
            VER="1.1.1"
            if [ -n "$INPUT_VER" ]; then
              VER="$INPUT_VER"
            elif [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VER="${BASH_REMATCH[1]}"
            fi

            cmake -B build-arm64 -S . -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DBASS_TARGET_ARCH=arm64
            ninja -C build-arm64 -v

            chmod +x ./scripts/package-linux.sh ./scripts/package-appimage.sh
            ./scripts/package-linux.sh -v "$VER" -a "arm64" -b "build-arm64" -d "dist"
            ./scripts/package-appimage.sh -v "$VER" -a "arm64" -b "build-arm64" -d "dist"
            chmod -R a+rw dist/

      - name: Verify Linux ARM64 Distributables
        run: |
          ls -lh dist/
          test -f dist/0rhxPlayer-v*-linux-arm64-portable.tar.gz
          test -f dist/0rhxPlayer-v*-linux-arm64.AppImage

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            dist/*arm64*.tar.gz
            dist/*arm64*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish Multi-Arch Release Assets
    needs: [build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          VER="1.1.1"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
          elif [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VER="${BASH_REMATCH[1]}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: |
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          name: "0rhxPlayer v${{ steps.get_version.outputs.version }}"
          body: |
            ## 0rhxPlayer v${{ steps.get_version.outputs.version }}

            Multi-architecture cross-platform release built with Qt 6.

            ### Release Assets (8-Artifact Suite)
            - **Windows x64**:
              - Installer: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-windows-x64-setup.exe`
              - Portable: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-windows-x64-portable.zip`
            - **Windows ARM64**:
              - Installer: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-windows-arm64-setup.exe`
              - Portable: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-windows-arm64-portable.zip`
            - **Linux x64**:
              - AppImage: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-linux-x64.AppImage`
              - Portable: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-linux-x64-portable.tar.gz`
            - **Linux ARM64**:
              - AppImage: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-linux-arm64.AppImage`
              - Portable: `0rhxPlayer-v${{ steps.get_version.outputs.version }}-linux-arm64-portable.tar.gz`

            ### Links
            - Website: https://0rhxplayer.rincynar.top
            - Repository: https://github.com/RinCynar/0rhxPlayer-Desktop
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
