name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev pkg-config

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri bundles
        run: pnpm tauri build ${{ matrix.args }}

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.0.0"
          $target = "${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "build-artifacts"

          # 1. Copy NSIS installer and MSI bundles
          Get-ChildItem -Path "src-tauri/target" -Recurse -File | Where-Object { ($_.Extension -eq ".exe" -or $_.Extension -eq ".msi") -and $_.FullName -like "*bundle*" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "build-artifacts/$($_.Name)" -Force
          }

          # 2. Package portable zip
          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -File | Where-Object { ($_.Name -eq "0rhxPlayer.exe" -or $_.Name -eq "app.exe") -and $_.FullName -like "*release*" -and $_.FullName -notlike "*deps*" -and $_.FullName -notlike "*build*" -and $_.FullName -notlike "*bundle*" } | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force -Path "dist-portable"
            Copy-Item $exe.FullName -Destination "dist-portable/0rhxPlayer.exe"
            Compress-Archive -Path "dist-portable/*" -DestinationPath "build-artifacts/0rhxPlayer_${ver}_${target}_portable.zip" -Force
          }

      - name: Prepare Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          ver="1.0.0"
          target="${{ matrix.target }}"
          mkdir -p build-artifacts

          # 1. Copy AppImage and deb bundles
          find src-tauri/target -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) | grep "bundle" | while read -r file; do
            cp "$file" build-artifacts/
          done

          # 2. Package portable tar.gz
          bin_path=$(find src-tauri/target -type f \( -name "0rhxPlayer" -o -name "app" \) | grep "release" | grep -v "deps" | grep -v "build" | grep -v "bundle" | head -n 1)
          if [ -n "$bin_path" ]; then
            mkdir -p dist-portable
            cp "$bin_path" dist-portable/0rhxPlayer
            chmod +x dist-portable/0rhxPlayer
            tar -czvf "build-artifacts/0rhxPlayer_${ver}_${target}.tar.gz" -C dist-portable 0rhxPlayer
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.target }}
          path: build-artifacts/*
          if-no-files-found: error

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la all-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: '0rhxPlayer v1.0.0'
          body: |
            ## 0rhxPlayer v1.0.0
            
            ### ✨ Features
            - **Audio Backend**: WASAPI / DirectSound stream scheduler with low latency.
            - **DSP Processing**: 10-Band Biquad Equalizer with presets.
            - **Material You 3.0**: M3 motion system with teal theme (#39C5BB).
            - **Cross-Platform Packages**: Native Windows (`.exe` installer / `.zip` portable) and Linux (`.AppImage` / `.tar.gz` portable).
            
            ### 🌐 Official Links
            - Website: [0rhxplayer.rincynar.top](https://0rhxplayer.rincynar.top)
            - VSCode Extension: [0rhxPlayer for VSCode](https://marketplace.visualstudio.com/items?itemName=RinCynar.0rhxplayer)
          draft: false
          prerelease: false
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
