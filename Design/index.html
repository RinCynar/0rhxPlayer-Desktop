            const [userProfile, setUserProfile] = useState({
                nickname: 'RinCynar',
                avatar: DEFAULT_AVATAR
            });

            // Audio Settings State
            const [audioSettings, setAudioSettings] = useState({
                driver: 'WASAPI Exclusive',
                resampler: 'SoX Resampler High Quality',
                bufferMs: 100,
                replayGain: 'Track Mode (-18 LUFS)',
                cueAutoScan: true,
                windowEffect: 'Mica Alt',
                globalHotkeys: true,
                systemTray: true
            });

            // Player State
            const [currentTrackIdx, setCurrentTrackIdx] = useState(0);
            const [isPlaying, setIsPlaying] = useState(true);
            const [currentTime, setCurrentTime] = useState(18);
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [playlistSubTab, setPlaylistSubTab] = useState('played'); 
            const [libFilterChip, setLibFilterChip] = useState('titles'); 
            const [tracks, setTracks] = useState(MOCK_TRACKS);
            const [userPlaylists, setUserPlaylists] = useState(MOCK_PLAYLISTS);

            const fileInputRef = useRef(null);
            const t = I18N[lang] || I18N.zh;
            const currentTrack = tracks[currentTrackIdx] || tracks[0];

            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'dark') {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
            }, [theme]);

            // Timer Loop
            useEffect(() => {
                let interval = null;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setCurrentTime(prev => {
                            if (prev >= currentTrack.duration) return 0;
                            return prev + 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isPlaying, currentTrack]);

            const getGreeting = () => {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) return t.greetingMorning;
                if (hour >= 12 && hour < 18) return t.greetingAfternoon;
                if (hour >= 18 && hour < 23) return t.greetingEvening;
                return t.greetingNight;
            };

            const toggleFavorite = (idx) => {
                const updated = [...tracks];
                updated[idx].favorite = !updated[idx].favorite;
                setTracks(updated);
            };

            const setRating = (idx, rating) => {
                const updated = [...tracks];
                updated[idx].rating = rating;
                setTracks(updated);
            };

            const handleAvatarSelect = (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {

                                        </div>

                                        {/* 2. 音频驱动与 DSP 引擎 */}
                                        <div className="bg-m3-cardLight dark:bg-m3-cardDark border border-m3-borderLight dark:border-m3-borderDark p-5 rounded-3xl space-y-4">
                                            <h2 className="text-sm font-bold text-m3-primaryLight dark:text-m3-primaryDark flex items-center gap-2">
                                                <i className="fa-solid fa-sliders"></i> {t.sectionAudioEngine}
                                            </h2>
                                            
                                            <div className="space-y-3 text-xs">
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <div className="font-semibold">{t.audioEngine}</div>
                                                        <div className="text-gray-500 text-[11px]">{t.audioEngineSub}</div>
                                                    </div>
                                                    <select 
                                                        value={audioSettings.driver} 
                                                        onChange={(e) => setAudioSettings({ ...audioSettings, driver: e.target.value })}
                                                        className="bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-xl px-3 py-1.5 text-xs"
                                                    >
                                                        <option value="WASAPI Exclusive">WASAPI Exclusive</option>
                                                        <option value="WASAPI Shared">WASAPI Shared</option>
                                                        <option value="DirectSound">DirectSound</option>
                                                    </select>
                                                </div>

                                                <div className="flex items-center justify-between pt-2 border-t border-m3-borderDark/40">
                                                    <div>
                                                        <div className="font-semibold">{t.resamplerAlgorithm}</div>
                                                        <div className="text-gray-500 text-[11px]">{t.resamplerSub}</div>
                                                    </div>
                                                    <select 
                                                        value={audioSettings.resampler} 
                                                        onChange={(e) => setAudioSettings({ ...audioSettings, resampler: e.target.value })}
                                                        className="bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-xl px-3 py-1.5 text-xs"
                                                    >
                                                        <option value="SoX Resampler High Quality">SoX Resampler (HQ)</option>
                                                        <option value="Speex DSP Resampler">Speex DSP</option>
                                                        <option value="Disabled">Bypass Pass-through</option>
                                                    </select>
                                                </div>

                                                <div className="flex items-center justify-between pt-2 border-t border-m3-borderDark/40">
                                                    <div>
                                                        <div className="font-semibold">{t.replayGainMode}</div>
                                                        <div className="text-gray-500 text-[11px]">{t.replayGainSub}</div>
                                                    </div>
                                                    <select 
                                                        value={audioSettings.replayGain} 
                                                        onChange={(e) => setAudioSettings({ ...audioSettings, replayGain: e.target.value })}
                                                        className="bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-xl px-3 py-1.5 text-xs"
                                                    >
                                                        <option value="Track Mode (-18 LUFS)">Track Mode (-18 LUFS)</option>
                                                        <option value="Album Mode">Album Mode</option>
                                                        <option value="Disabled">Disabled</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        {/* 3. 歌词与界面定制 */}
                                        <div className="bg-m3-cardLight dark:bg-m3-cardDark border border-m3-borderLight dark:border-m3-borderDark p-5 rounded-3xl space-y-4">
                                            <h2 className="text-sm font-bold text-m3-primaryLight dark:text-m3-primaryDark flex items-center gap-2">
                                                <i className="fa-solid fa-palette"></i> {t.sectionInterface}
                                            </h2>

                                            {/* 歌词对齐控制 */}
                                            <div className="flex items-center justify-between text-xs">
                                                <div>
                                                    <div className="font-semibold">{t.lyricAlign}</div>
                                                    <div className="text-gray-500 text-[11px]">{t.lyricAlignSub}</div>
                                                </div>
                                                <div className="bg-black/5 dark:bg-white/5 p-1 rounded-2xl flex items-center space-x-1 border border-m3-borderLight dark:border-m3-borderDark">
                                                    {['right', 'center', 'left'].map((align) => (
                                                        <button 
                                                            key={align}
                                                            onClick={() => setLyricsAlign(align)}
                                                            className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${lyricsAlign === align ? 'bg-m3-primaryLight dark:bg-m3-primaryDark text-white dark:text-m3-onPrimaryDark' : 'opacity-60'}`}
                                                        >
                                                            {align === 'right' ? t.alignRight : align === 'center' ? t.alignCenter : t.alignLeft}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* 罗马音显隐控制 */}
                                            <div className="flex items-center justify-between text-xs pt-2 border-t border-m3-borderDark/40">
                                                <div>
                                                    <div className="font-semibold">{t.showRomaji}</div>
                                                    <div className="text-gray-500 text-[11px]">{t.romajiSub}</div>
                                                </div>
                                                <button 
                                                    onClick={() => setShowRomaji(!showRomaji)}
                                                    className={`w-11 h-6 rounded-full transition relative p-0.5 ${showRomaji ? 'bg-m3-primaryLight dark:bg-m3-primaryDark' : 'bg-gray-600'}`}
                                                >
                                                    <div className={`w-5 h-5 rounded-full bg-white transition transform ${showRomaji ? 'translate-x-5' : 'translate-x-0'}`}></div>
                                                </button>
                                            </div>

                                            {/* 译文显隐控制 */}
                                            <div className="flex items-center justify-between text-xs pt-2 border-t border-m3-borderDark/40">
                                                <div>
                                                    <div className="font-semibold">{t.showTrans}</div>
                                                    <div className="text-gray-500 text-[11px]">{t.transSub}</div>
                                                </div>
                                                <button 
                                                    onClick={() => setShowTrans(!showTrans)}
                                                    className={`w-11 h-6 rounded-full transition relative p-0.5 ${showTrans ? 'bg-m3-primaryLight dark:bg-m3-primaryDark' : 'bg-gray-600'}`}
                                                >
                                                    <div className={`w-5 h-5 rounded-full bg-white transition transform ${showTrans ? 'translate-x-5' : 'translate-x-0'}`}></div>
                                                </button>
                                            </div>

                                            {/* 纯正语言选择 */}
                                            <div className="flex items-center justify-between text-xs pt-2 border-t border-m3-borderDark/40">
                                                <div>
                                                    <div className="font-semibold">{t.language}</div>
                                                    <div className="text-gray-500 text-[11px]">{t.languageSub}</div>
                                                </div>
                                                <select 
                                                    value={lang} 
                                                    onChange={(e) => setLang(e.target.value)}
                                                    className="bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-xl px-3 py-1.5 text-xs font-medium"
                                                >
                                                    <option value="zh">简体中文 (Chinese)</option>
                                                    <option value="en">English (US)</option>
                                                    <option value="ja">日本語 (Japanese)</option>
                                                </select>
                                            </div>

                                            {/* 窗口背景材质 */}
                                            <div className="flex items-center justify-between text-xs pt-2 border-t border-m3-borderDark/40">
                                                <div>
                                                    <div className="font-semibold">{t.windowEffect}</div>
                                                    <div className="text-gray-500 text-[11px]">{t.windowEffectSub}</div>
                                                </div>
                                                <select 
                                                    value={audioSettings.windowEffect} 
                                                    onChange={(e) => setAudioSettings({ ...audioSettings, windowEffect: e.target.value })}
                                                    className="bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-xl px-3 py-1.5 text-xs"
                                                >
                                                    <option value="Mica Alt">Mica Alt</option>
                                                    <option value="Acrylic Blur">Acrylic Blur</option>
                                                    <option value="Solid Opaque">Solid Opaque</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* 4. 系统行为 */}
                                        <div className="bg-m3-cardLight dark:bg-m3-cardDark border border-m3-borderLight dark:border-m3-borderDark p-5 rounded-3xl flex items-center justify-between text-xs">
                                            <div>
                                                <div className="font-semibold">{t.systemTray}</div>
                                                <div className="text-gray-500 text-[11px]">{t.systemTraySub}</div>
                                            </div>
                                            <button 
                                                onClick={() => setAudioSettings({ ...audioSettings, systemTray: !audioSettings.systemTray })}
                                                className={`w-11 h-6 rounded-full transition relative p-0.5 ${audioSettings.systemTray ? 'bg-m3-primaryLight dark:bg-m3-primaryDark' : 'bg-gray-600'}`}
                                            >
                                                <div className={`w-5 h-5 rounded-full bg-white transition transform ${audioSettings.systemTray ? 'translate-x-5' : 'translate-x-0'}`}></div>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>

                        {}
                        {/* NOW PLAYING DRAWER */}
                        <div className={`absolute inset-0 ${theme === 'dark' ? 'bg-[#131317]' : 'bg-[#F6F2F8]'} z-40 transition-transform duration-500 transform ${isDrawerOpen ? 'translate-y-0' : 'translate-y-full'} flex flex-col p-6 overflow-hidden pb-24`}>
                            {/* Drawer 关闭按键 */}
                            <div className="absolute top-6 right-8 z-50">
                                <button 
                                    onClick={() => setIsDrawerOpen(false)}
                                    className="w-10 h-10 rounded-full bg-black/10 dark:bg-white/10 flex items-center justify-center hover:bg-black/20 dark:hover:bg-white/20 transition"
                                >
                                    <i className="fa-solid fa-chevron-down text-lg"></i>
                                </button>
                            </div>

                            <div className="max-w-6xl w-full mx-auto flex-1 flex flex-col justify-center items-center py-2 my-auto overflow-hidden">
                                {currentTrack.lyrics && currentTrack.lyrics.length > 0 ? (
                                    <div className="w-full h-full flex flex-row items-center justify-between gap-6 sm:gap-10 animate-fadeIn overflow-hidden px-2">
                                        {/* Left Cover & Metadata */}
                                        <div className="flex flex-col items-center text-center w-1/3 min-w-[170px] max-w-[240px] shrink-0">
                                            <img src={currentTrack.cover} className="w-36 h-36 sm:w-48 sm:h-48 rounded-2xl object-cover shadow-2xl mb-3" />
                                            <h2 className="text-base sm:text-xl font-bold tracking-tight truncate max-w-full">{currentTrack.title}</h2>
                                            <p className="text-m3-primaryLight dark:text-m3-primaryDark font-medium text-xs sm:text-sm mt-0.5 truncate max-w-full">{currentTrack.artist}</p>
                                            <p className="text-[11px] text-gray-500 dark:text-gray-400 mt-0.5 truncate max-w-full">{currentTrack.album}</p>

                                            <div className="mt-3 bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-xl p-2.5 w-full text-left font-mono text-[11px] space-y-1">
                                                <div className="flex justify-between"><span>{t.formatLabel}:</span><span className="text-amber-500 dark:text-amber-300">{currentTrack.format}</span></div>
                                                <div className="flex justify-between"><span>{t.bitrateLabel}:</span><span className="text-emerald-500 dark:text-emerald-400">{currentTrack.bitrate}</span></div>
                                                <div className="flex justify-between"><span>{t.engineLabel}:</span><span className="text-m3-primaryLight dark:text-m3-primaryDark">WASAPI Exclusive</span></div>
                                            </div>
                                        </div>

                                        {/* Right Multi-line Lyrics Stream */}
                                        <div className="flex-1 w-2/3 h-full max-h-[380px] flex flex-col justify-center overflow-y-auto py-4 px-2 relative border-l border-m3-borderLight dark:border-m3-borderDark pl-6 sm:pl-8">
                                            <div className={`space-y-6 my-auto ${lyricsAlign === 'right' ? 'text-right' : lyricsAlign === 'center' ? 'text-center' : 'text-left'}`}>
                                                {currentTrack.lyrics.map((line, idx) => {
                                                    const isActive = currentTime >= line.time;
                                                    const transText = typeof line.trans === 'object' ? (line.trans[lang] || line.trans.zh || Object.values(line.trans)[0]) : line.trans;

                                                    return (
                                                        <div 
                                                            key={idx}
                                                            onClick={() => setCurrentTime(line.time)}
                                                            className={`cursor-pointer transition-all duration-300 ${isActive ? 'opacity-100 scale-[1.02]' : 'opacity-30 hover:opacity-70'}`}
                                                        >
                                                            {/* 1. 罗马音 / 注音行 */}
                                                            {showRomaji && line.roma && (
                                                                <div className={`text-[11px] font-mono mb-0.5 ${isActive ? 'text-m3-primaryLight dark:text-m3-secondaryDark font-medium' : 'text-gray-500 dark:text-gray-400'}`}>
                                                                    {line.roma}
                                                                </div>
                                                            )}
                                                            {/* 2. 主歌词行 */}
                                                            <div className={`font-bold tracking-wide transition-all ${isActive ? 'text-xl sm:text-2xl text-gray-900 dark:text-white' : 'text-base sm:text-lg text-gray-600 dark:text-gray-300'}`}>
                                                                {line.text}
                                                            </div>
                                                            {/* 3. 翻译行 */}
                                                            {showTrans && transText && (
                                                                <div className={`text-xs sm:text-sm mt-1 font-normal ${isActive ? 'text-gray-700 dark:text-gray-200' : 'text-gray-500 dark:text-gray-400'}`}>
                                                                    {transText}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center text-center max-w-md w-full animate-fadeIn my-auto">
                                        <img src={currentTrack.cover} className="w-52 h-52 rounded-3xl object-cover shadow-2xl mb-5" />
                                        <h2 className="text-xl font-bold tracking-tight">{currentTrack.title}</h2>
                                        <p className="text-m3-primaryLight dark:text-m3-primaryDark font-medium text-xs mt-1">{currentTrack.artist}</p>
                                        <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{currentTrack.album}</p>

                                        <div className="mt-5 bg-black/5 dark:bg-white/5 border border-m3-borderLight dark:border-m3-borderDark rounded-2xl p-3.5 w-full text-left font-mono text-xs space-y-1.5">
                                            <div className="flex justify-between"><span>{t.formatLabel}:</span><span className="text-amber-500 dark:text-amber-300">{currentTrack.format}</span></div>
                                            <div className="flex justify-between"><span>{t.bitrateLabel}:</span><span className="text-emerald-500 dark:text-emerald-400">{currentTrack.bitrate}</span></div>
                                            <div className="flex justify-between"><span>{t.engineLabel}:</span><span className="text-m3-primaryLight dark:text-m3-primaryDark">WASAPI Exclusive</span></div>
                                        </div>
                                        <div className="mt-4 text-xs text-gray-500 italic flex items-center gap-2">
                                            <i className="fa-solid fa-music opacity-60"></i>
                                            <span>{t.noLyrics}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>

                    {}
                    {/* 底部全局 Mini Player Bar */}
                    <footer className={`h-20 ${theme === 'dark' ? 'bg-m3-surfaceDark border-m3-borderDark' : 'bg-m3-surfaceLight border-m3-borderLight'} border-t px-6 flex items-center justify-between shrink-0 z-30 relative`}>
                        <div className="absolute top-0 left-0 right-0 h-1 bg-black/10 dark:bg-white/10 cursor-pointer group" onClick={(e) => {
                            const rect = e.currentTarget.getBoundingClientRect();
                            const pct = (e.clientX - rect.left) / rect.width;
                            setCurrentTime(Math.floor(pct * currentTrack.duration));
                        }}>
                            <div 
                                className="h-full bg-m3-primaryLight dark:bg-m3-primaryDark transition-all duration-100 relative" 
                                style={{ width: `${(currentTime / currentTrack.duration) * 100}%` }}
                            >
                                <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-m3-primaryLight dark:bg-m3-primaryDark shadow opacity-0 group-hover:opacity-100 transition"></div>
                            </div>
                        </div>

                        <div onClick={() => setIsDrawerOpen(true)} className="flex items-center space-x-3.5 cursor-pointer group w-1/3">
                            <img src={currentTrack.cover} className="w-12 h-12 rounded-xl object-cover group-hover:opacity-80 transition" />
                            <div className="truncate">
                                <div className="text-sm font-semibold truncate group-hover:text-m3-primaryLight dark:group-hover:text-m3-primaryDark transition">{currentTrack.title}</div>
                                <div className="text-xs text-gray-500 dark:text-gray-400 truncate mt-0.5">{currentTrack.artist}</div>
                            </div>
                        </div>

                        <div className="flex items-center space-x-4 sm:space-x-6 justify-end w-2/3">
                            {/* 仅在 NowPlaying 展开时在控制栏显示 罗马音 与 译文 切换按钮 */}
                            {isDrawerOpen && (
                                <div className="flex items-center space-x-1.5 mr-2 animate-fadeIn">
                                    <button 
                                        onClick={() => setShowRomaji(!showRomaji)}
                                        title={t.showRomaji}
                                        className={`w-7 h-7 rounded-full text-xs font-semibold flex items-center justify-center transition border ${showRomaji ? 'bg-m3-primaryContainerLight dark:bg-m3-primaryContainerDark text-m3-primaryLight dark:text-m3-primaryDark border-m3-primaryDark' : 'bg-black/5 dark:bg-white/5 border-transparent text-gray-400'}`}
                                    >
                                        罗
                                    </button>
                                    <button 
                                        onClick={() => setShowTrans(!showTrans)}
                                        title={t.showTrans}
                                        className={`w-7 h-7 rounded-full text-xs font-semibold flex items-center justify-center transition border ${showTrans ? 'bg-m3-primaryContainerLight dark:bg-m3-primaryContainerDark text-m3-primaryLight dark:text-m3-primaryDark border-m3-primaryDark' : 'bg-black/5 dark:bg-white/5 border-transparent text-gray-400'}`}
                                    >
                                        译
                                    </button>
                                </div>
                            )}

                            <button className="text-gray-400 hover:text-gray-200 text-xs transition">
                                <i className="fa-solid fa-shuffle"></i>
                            </button>
                            <button 
                                onClick={() => setCurrentTrackIdx((currentTrackIdx - 1 + tracks.length) % tracks.length)}
                                className="text-gray-400 hover:text-gray-200 text-base transition"
                            >
                                <i className="fa-solid fa-backward-step"></i>
                            </button>
                            <button 
                                onClick={() => setIsPlaying(!isPlaying)}
                                className="w-10 h-10 rounded-full bg-m3-primaryLight dark:bg-m3-primaryDark text-white dark:text-m3-onPrimaryDark flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-md"
                            >
                                <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play pl-0.5'} text-base`}></i>
                            </button>
                            <button 
                                onClick={() => setCurrentTrackIdx((currentTrackIdx + 1) % tracks.length)}
                                className="text-gray-400 hover:text-gray-200 text-base transition"
                            >
                                <i className="fa-solid fa-forward-step"></i>
                            </button>

                            {/* 播放队列按钮 */}
                            <button 
                                onClick={() => { setActiveTab('queue'); setIsDrawerOpen(false); }}
                                className={`text-base transition ${activeTab === 'queue' ? 'text-m3-primaryLight dark:text-m3-primaryDark' : 'text-gray-400 hover:text-gray-200'}`}
                                title={t.queue}
                            >
                                <i className="fa-solid fa-list-ol"></i>
                            </button>
                        </div>
                    </footer>

                    {}
                    {/* 编辑侧边栏 模态框 (完全可用的勾选定制) */}
                    {isEditingNav && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
                            <div className="bg-m3-cardDark border border-m3-borderDark rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                <h3 className="text-base font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-pen-to-square text-m3-primaryDark"></i> {t.navRailCustom}
                                </h3>
                                <p className="text-xs text-gray-400">{t.navRailCustomDesc}</p>
                                
                                <div className="space-y-2 py-2">
                                    {ALL_NAV_ITEMS.map((item) => {
                                        const isChecked = tempNavIds.includes(item.id);
                                        const isHome = item.id === 'home';
                                        return (
                                            <div 
                                                key={item.id}
                                                onClick={() => toggleNavItemInCustomizer(item.id)}
                                                className={`flex items-center justify-between p-3 rounded-2xl transition cursor-pointer border ${isChecked ? 'bg-m3-primaryContainerDark/50 border-m3-primaryDark/50 text-white' : 'bg-white/5 border-transparent opacity-60'}`}
                                            >
                                                <div className="flex items-center space-x-3 text-xs">
                                                    <i className={`fa-solid ${item.icon} text-sm w-5 text-center`}></i>
                                                    <span className="font-medium">{t[item.labelKey]}</span>
                                                </div>
                                                <input 
                                                    type="checkbox" 
                                                    checked={isChecked} 
                                                    disabled={isHome}
                                                    onChange={() => {}}
                                                    className="w-4 h-4 accent-purple-500 rounded cursor-pointer"
                                                />
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex justify-end space-x-3 pt-2 border-t border-m3-borderDark/40">
                                    <button 
                                        onClick={() => setIsEditingNav(false)}
                                        className="px-4 py-2 rounded-full text-xs font-semibold text-gray-400 hover:text-white transition"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        onClick={saveNavCustomization}
                                        className="px-5 py-2 rounded-full bg-m3-primaryDark text-m3-onPrimaryDark font-semibold text-xs hover:opacity-90 transition shadow"
                                    >
                                        {t.saveNavCustom}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
